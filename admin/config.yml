# Use DecapBridge PKCE auth (required)
backend:
  name: git-gateway
  repo: qltystnc-lab/qltystnc-site
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/4adfffbd-c8f3-4e8b-bcb7-af7c832b6bac/pkce
  auth_token_endpoint: /sites/4adfffbd-c8f3-4e8b-bcb7-af7c832b6bac/token
  gateway_url: https://gateway.decapbridge.com

media_folder: "uploads"
public_folder: "/uploads"

site_url: https://qltystnc.com

collections:
  - name: "produtos"
    label: "Loja — Produtos"
    label_singular: "Produto"
    folder: "content/produtos"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Nome do Produto", name: "title", widget: "string" }
      - { label: "Linha", name: "linha", widget: "select", options: ["DRAKO 3D", "ZOOP", "AURE"] }
      - { label: "Descrição Curta", name: "subtitulo", widget: "string", required: false, hint: "Ex: Compatível Smart Fortwo 450/451" }
      - { label: "Preço (€)", name: "preco", widget: "number", value_type: "float" }
      - { label: "Foto", name: "foto", widget: "image" }
      - { label: "Link PayPal", name: "link_paypal", widget: "string", hint: "Cola aqui o link do botão PayPal (paypal.me/... ou link 'Buy Now')" }
      - { label: "Link de Pagamento Stripe (opcional, para mais tarde)", name: "link_stripe", widget: "string", required: false, hint: "Deixa vazio por agora — ativa quando quiseres usar Stripe/MB WAY" }
      - { label: "Data (para ordenação)", name: "date", widget: "datetime" }
      - { label: "Notas / Descrição completa", name: "body", widget: "markdown", required: false }

  - name: "eventos"
    label: "Calendário de Eventos"
    label_singular: "Evento"
    folder: "content/eventos"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Nome do Evento", name: "title", widget: "string" }
      - { label: "Tipo", name: "tipo", widget: "select", options: ["Drift", "Stance", "Track Day", "Exposição", "Convívio", "Rali", "Outro"] }
      - { label: "País", name: "pais", widget: "select", options: ["Portugal", "Estrangeiro"], default: "Portugal" }
      - { label: "Nome do País (se Estrangeiro)", name: "pais_nome", widget: "string", required: false, hint: "Ex: Espanha, França — só preenche se o evento for no estrangeiro" }
      - { label: "Data de Início", name: "date", widget: "datetime" }
      - { label: "Data de Fim (opcional, se for mais de 1 dia)", name: "date_fim", widget: "datetime", required: false }
      - { label: "Localização", name: "localizacao", widget: "string" }
      - { label: "Link Oficial (site/facebook/instagram do evento)", name: "link", widget: "string", required: false }
      - { label: "QLTYSTNC vai estar presente?", name: "vamos", widget: "boolean", default: false }
      - { label: "Foto de capa", name: "capa", widget: "image", required: false }
      - { label: "Notas / Descrição", name: "body", widget: "markdown", required: false }

  - name: "sessoes"
    label: "Sessões / Projetos"
    label_singular: "Sessão"
    folder: "content/sessoes"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Tipo", name: "tipo", widget: "select", options: ["Evento", "Sessão", "Drift"] }
      - { label: "Data", name: "date", widget: "datetime" }
      - { label: "Localização", name: "localizacao", widget: "string", required: false }
      - { label: "Foto de capa", name: "capa", widget: "image" }
      - { label: "Galeria (fotos adicionais)", name: "galeria", widget: "list", field: { label: "Foto", name: "foto", widget: "image" }, required: false }
      - { label: "Texto / Legenda", name: "body", widget: "markdown" }
      - { label: "Destacar na home", name: "destaque", widget: "boolean", default: false }

  - name: "reportagens"
    label: "Reportagens"
    label_singular: "Reportagem"
    folder: "content/reportagens"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Subtítulo / linha editorial", name: "subtitulo", widget: "string", required: false }
      - { label: "Data", name: "date", widget: "datetime" }
      - { label: "Foto de capa", name: "capa", widget: "image" }
      - { label: "Texto completo", name: "body", widget: "markdown" }
      - { label: "Créditos (fotógrafo/piloto)", name: "creditos", widget: "string", required: false }

<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QLTYSTNC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Archivo:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#0a0a0a; --panel:#141416; --line:#2b2b2e;
    --off:#eeece6; --mute:#9a9994; --signal:#ff5a1f; --ok:#7a8f6e;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{background:var(--black);color:var(--off);font-family:'Archivo',sans-serif;-webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:0.01em;font-weight:700;}
  .mono{font-family:'JetBrains Mono',monospace;letter-spacing:0.08em;text-transform:uppercase;}
  a{color:inherit;text-decoration:none;}
  img{display:block;max-width:100%;}

  .nav{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:16px 20px;background:rgba(10,10,10,0.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);}
  .nav .logo{font-family:'Oswald',sans-serif;font-weight:700;font-size:20px;letter-spacing:0.04em;}
  .nav .logo span{color:var(--signal);}
  .back-link{font-size:12px;font-family:'JetBrains Mono',monospace;letter-spacing:0.08em;color:var(--mute);}
  .back-link:hover{color:var(--off);}

  .eyebrow{font-size:11px;color:var(--signal);margin-bottom:14px;display:flex;align-items:center;gap:8px;}
  .eyebrow::before{content:'';width:18px;height:1px;background:var(--signal);}

  main{max-width:760px;margin:0 auto;padding:56px 20px 100px;}
  .article-body p{margin-bottom:20px;line-height:1.7;font-size:16px;color:#d8d6d0;}
  .article-body blockquote{border-left:2px solid var(--signal);padding:4px 0 4px 20px;margin:28px 0;font-style:italic;color:var(--off);}
  .article-body h3{font-size:20px;margin:32px 0 14px;}
  .article-body ul{margin:0 0 20px 20px;color:#d8d6d0;}
  .article-body li{margin-bottom:6px;line-height:1.6;}

  footer{padding:48px 20px 32px;border-top:1px solid var(--line);}
  .foot-bottom{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:11px;color:var(--mute);font-family:'JetBrains Mono',monospace;}
</style>
</head>
<body>

<nav class="nav">
  <a href="index.html" class="logo">QLTY<span>STNC</span></a>
  <a href="index.html" class="back-link">← VOLTAR</a>
</nav>

<main id="post-root">
  <p class="mono" style="color:var(--mute)">A carregar...</p>
</main>

<footer>
  <div class="foot-bottom">
    <span>© 2026 QLTYSTNC — RICARDO ROCHA</span>
    <span>PORTO · PORTUGAL</span>
  </div>
</footer>

<script src="assets/site.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    window.QLTYSTNC.renderPost();
  });
</script>

</body>
</html>
